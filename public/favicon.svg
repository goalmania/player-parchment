<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#0d0d0d"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="44" stroke="#ffffff" stroke-width="7"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="28" stroke="#999999" stroke-width="4" fill="rgba(255,255,255,0.08)"/>
  <!-- Crosshair top -->
  <line x1="50" y1="6"  x2="50" y2="22" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Crosshair bottom -->
  <line x1="50" y1="78" x2="50" y2="94" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Crosshair left -->
  <line x1="6"  y1="50" x2="22" y2="50" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- Crosshair right -->
  <line x1="78" y1="50" x2="94" y2="50" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- D -->
  <text x="35" y="55" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="18" fill="#ffffff">D</text>
  <!-- Lime dot -->
  <circle cx="50" cy="50" r="4" fill="#c8f135"/>
  <!-- M -->
  <text x="65" y="55" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="18" fill="#ffffff">M</text>
</svg>
